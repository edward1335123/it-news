# 収集 → ビルド → Cloudflare Pages へのデプロイ（手順と Secrets は docs/DEPLOY.md）
name: deploy

on:
  push:
    branches: [main]
  schedule:
    # 3時間ごと（UTC 0・3・6…時の17分 = 日本時間 0・3・6…時の17分）。
    # 0分ちょうどは混み合って遅れやすいので少しずらす
    - cron: '17 */3 * * *'
  workflow_dispatch:

# 前回の data/*.json を引き継ぐので、同時に2つ走らせない。
# 待てるのは最新の1件だけで、それより前に待っていた実行は取り消される
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # 定時実行でも検証する。push の実行が失敗したコミットや、
      # 後から来た実行に取り消されたコミットを、検証せずにデプロイしないため
      - name: lint・型・テスト
        run: npm run check

      # news.json・events.json は git 管理外なので、前回の実行で保存したものを戻す。
      # キーは毎回変わるので、restore-keys で一番新しいものが選ばれる
      - name: 前回のデータを戻す
        uses: actions/cache/restore@v4
        with:
          path: |
            app/public/data/news.json
            app/public/data/events.json
          key: data-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: data-

      # 一部の情報源が失敗してもデプロイは続ける（失敗はログに残る）。
      # 全滅したときは前回のファイルがそのまま残る
      - name: ニュースとイベントを収集
        timeout-minutes: 15
        env:
          CONNPASS_API_KEY: ${{ secrets.CONNPASS_API_KEY }}
        run: |
          npm run collect:news &
          news=$!
          npm run collect:events &
          events=$!
          wait "$news" || echo "::warning::ニュースの収集に失敗した。前回の news.json を使う"
          wait "$events" || echo "::warning::イベントの収集に失敗した。前回の events.json を使う"

      # 壊れたファイルを保存・デプロイしないよう、JSON として読めるかまで確かめる
      - name: データがあるか確かめる
        run: |
          for f in news.json events.json; do
            node -e 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))' "app/public/data/$f"               || { echo "::error::app/public/data/$f がないか、JSON として正しくない"; exit 1; }
          done

      - name: データを次回のために保存する
        uses: actions/cache/save@v4
        with:
          path: |
            app/public/data/news.json
            app/public/data/events.json
          key: data-${{ github.run_id }}-${{ github.run_attempt }}

      # VAPID 公開鍵は公開してよい値なので、Variable からアプリに埋め込む
      - run: npm run build
        env:
          VITE_VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}

      # --branch=main で本番（Production）のデプロイになる。
      # API トークンを渡すので、wrangler は版を固定する（上げるときは DEPLOY.md の版も揃える）
      - name: Cloudflare Pages にデプロイ
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          test -n "$PROJECT" || { echo "::error::Variables に CLOUDFLARE_PAGES_PROJECT がない"; exit 1; }
          npx --yes wrangler@4.152.0 pages deploy app/dist --project-name="$PROJECT" --branch=main --commit-dirty=true

      # 送信済みの記録（collector/.state）を戻す。データとは別のキャッシュにする
      - name: 送信済みの記録を戻す
        uses: actions/cache/restore@v4
        with:
          path: collector/.state
          key: notify-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: notify-

      # 鍵や購読情報が未登録なら何もしない。送信に失敗してもデプロイ済みなので、警告に留める
      - name: 新着を通知する
        env:
          VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          PUSH_CONFIG: ${{ secrets.PUSH_CONFIG }}
        run: npm run notify || echo "::warning::通知の送信に失敗した。ログの [notify] を見る"

      # 送れた分だけ記録されているので、失敗したときも保存する
      - name: 送信済みの記録を保存する
        if: ${{ !cancelled() && hashFiles('collector/.state/notify-state.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: collector/.state
          key: notify-${{ github.run_id }}-${{ github.run_attempt }}
