# プッシュ通知のテスト送信（手動で実行する。手順は docs/NOTIFY.md）
name: notify-test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: テスト通知を送る
        env:
          VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          PUSH_CONFIG: ${{ secrets.PUSH_CONFIG }}
        run: npm run notify:test
